name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python modules
        run: python -m compileall -q app.py sothema_views.py sothema_quality.py ats_api.py utils
      - name: Run tests with isolated database
        env:
          SOTHEMA_DB_PATH: ${{ runner.temp }}/sothema-ci.db
        run: python -m pytest -q

  reference-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/react-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reference/react-design/package-lock.json
      - run: npm ci
      - run: npm run build
